<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="560" viewBox="0 0 1500 560"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2933"/></marker></defs><rect width="1500" height="560" fill="#ffffff"/><text x="750" y="34" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#1f2933">System context: Truth Social post market-reaction alerts</text><rect x="560" y="200" width="380" height="170" rx="12" fill="#e3f0ff" stroke="#1d4f91" stroke-width="2.5"/><text x="750" y="262" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#1f2933">Post alert system</text><text x="750" y="292" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1f2933">ingests, trains, serves, monitors</text><text x="750" y="316" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#52606d" font-style="italic">(everything inside this box is built in the project)</text><rect x="30" y="80" width="320" height="90" rx="8" fill="#f4f6f8" stroke="#52606d" stroke-width="1.5"/><text x="190.0" y="102" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2933">Hugging Face posts archive</text><text x="190.0" y="128" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1f2933">dataset chrissoria/trump-truth-social</text><rect x="30" y="235" width="320" height="90" rx="8" fill="#f4f6f8" stroke="#52606d" stroke-width="1.5"/><text x="190.0" y="257" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2933">Yahoo Finance</text><text x="190.0" y="283" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1f2933">yfinance, S&amp;P 500 hourly bars</text><text x="190.0" y="301" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1f2933">(also the label source)</text><rect x="30" y="390" width="320" height="90" rx="8" fill="#f4f6f8" stroke="#52606d" stroke-width="1.5"/><text x="190.0" y="412" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2933">Truth Social post feed</text><text x="190.0" y="438" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1f2933">live feed is out of scope; emulated</text><text x="190.0" y="456" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1f2933">by replaying the archive (Post replayer)</text><path d="M 350 125 L 455 125 L 455 245 L 560 245" fill="none" stroke="#1f2933" stroke-width="1.8" marker-end="url(#ah)"/><text x="455" y="112" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2933" stroke="white" stroke-width="5" paint-order="stroke" stroke-linejoin="round">raw posts, monthly batch</text><path d="M 350 280 L 560 280" fill="none" stroke="#1f2933" stroke-width="1.8" marker-end="url(#ah)"/><text x="455" y="268" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2933" stroke="white" stroke-width="5" paint-order="stroke" stroke-linejoin="round">hourly bars: features and labels</text><text x="455" y="298" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2933" stroke="white" stroke-width="5" paint-order="stroke" stroke-linejoin="round">(monthly batch + latest bar)</text><path d="M 350 435 L 455 435 L 455 330 L 560 330" fill="none" stroke="#1f2933" stroke-width="1.8" marker-end="url(#ah)"/><text x="455" y="452" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2933" stroke="white" stroke-width="5" paint-order="stroke" stroke-linejoin="round">one post per request</text><rect x="1150" y="100" width="320" height="90" rx="8" fill="#f4f6f8" stroke="#52606d" stroke-width="1.5"/><text x="1310.0" y="122" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2933">Analyst</text><text x="1310.0" y="148" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1f2933">receives alerts in the alert channel</text><rect x="1150" y="380" width="320" height="90" rx="8" fill="#f4f6f8" stroke="#52606d" stroke-width="1.5"/><text x="1310.0" y="402" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2933">System owner</text><text x="1310.0" y="428" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1f2933">reviews drift alerts and model comparisons</text><path d="M 940 245 L 1045 245 L 1045 145 L 1150 145" fill="none" stroke="#1f2933" stroke-width="1.8" marker-end="url(#ah)"/><text x="1045" y="132" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2933" stroke="white" stroke-width="5" paint-order="stroke" stroke-linejoin="round">alerts: top 20% of posts by score</text><path d="M 940 330 L 1100 330 L 1100 405 L 1150 405" fill="none" stroke="#1f2933" stroke-width="1.8" marker-end="url(#ah)"/><text x="1020" y="296" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2933" stroke="white" stroke-width="5" paint-order="stroke" stroke-linejoin="round">drift alerts,</text><text x="1020" y="311" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2933" stroke="white" stroke-width="5" paint-order="stroke" stroke-linejoin="round">model comparison reports</text><path d="M 1150 450 L 1000 450 L 1000 355 L 940 355" fill="none" stroke="#1f2933" stroke-width="1.8" marker-end="url(#ah)"/><text x="1140" y="470" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="end" fill="#1f2933" stroke="white" stroke-width="5" paint-order="stroke" stroke-linejoin="round">promotion approval, rollback</text><text x="750" y="535" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#52606d" font-style="italic">Every external party is outside the box. Arrows are labelled with what flows.</text></svg>
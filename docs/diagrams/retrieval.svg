s-serif" font-size="12" text-anchor="middle" fill="#52606d">prompt file rag_answer.md (hashed)</text><text x="670.0" y="394" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#52606d">answers from the passages only</text><rect x="855" y="330" width="295" height="86" rx="8" fill="#f4f6f8" stroke="#52606d" stroke-width="1.5"/><text x="1002.5" y="356" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2933">Answer + MLflow run</text><text x="1002.5" y="378" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#52606d">hit rate, MRR, judge score,</text><text x="1002.5" y="394" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#52606d">tokens, cost, p50 / p95 latency</text><line x1="230" y1="373" x2="285" y2="373" stroke="#1f2933" stroke-width="1.5" marker-end="url(#ah)"/><line x1="485" y1="373" x2="540" y2="373" stroke="#1f2933" stroke-width="1.5" marker-end="url(#ah)"/><line x1="800" y1="373" x2="855" y2="373" stroke="#1f2933" stroke-width="1.5" marker-end="url(#ah)"/><line x1="970" y1="236" x2="435" y2="330" stroke="#1f2933" stroke-width="1.5" marker-end="url(#ah)"/><text x="702.5" y="277.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#52606d">nearest chunks</text><text x="590.0" y="458" font-family="Helvetica, Arial, sans-serif" font-size="12" font-style="italic" text-anchor="middle" fill="#52606d">The query path refuses to run when the index was built with other settings than config.yaml.</text></svg>
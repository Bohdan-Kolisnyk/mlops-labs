<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="470" viewBox="0 0 1180 470" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2933"/></marker></defs><rect width="1180" height="470" fill="#ffffff"/><text x="590.0" y="28" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2933">Retrieval pipeline: corpus in, answer out, every setting in one file</text><rect x="400" y="44" width="380" height="70" rx="8" fill="#fff4e0" stroke="#b7791f" stroke-width="1.5"/><text x="590.0" y="70" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2933">rag/config.yaml</text><text x="590.0" y="92" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#52606d">chunk size, overlap, embedding model, top-k,</text><text x="590.0" y="108" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#52606d">LLM model and prompt paths</text><rect x="30" y="150" width="200" height="86" rx="8" fill="#f4f6f8" stroke="#52606d" stroke-width="1.5"/><text x="130.0" y="176" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2933">Corpus</text><text x="130.0" y="198" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#52606d">post archive with the measured</text><text x="130.0" y="214" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#52606d">market reaction</text><text x="130.0" y="230" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#52606d">scripts/export_rag_corpus.py</text><rect x="285" y="150" width="200" height="86" rx="8" fill="#f4f6f8" stroke="#52606d" stroke-width="1.5"/><text x="385.0" y="176" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2933">Chunk</text><text x="385.0" y="198" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#52606d">120 words, overlap 20</text><text x="385.0" y="214" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#52606d">post date in front of each chunk</text><rect x="540" y="150" width="200" height="86" rx="8" fill="#f4f6f8" stroke="#52606d" stroke-width="1.5"/><text x="640.0" y="176" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2933">Embed</text><text x="640.0" y="198" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#52606d">all-MiniLM-L6-v2, CPU</text><text x="640.0" y="214" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#52606d">384 dimensions</text><rect x="795" y="150" width="355" height="86" rx="8" fill="#f4f6f8" stroke="#52606d" stroke-width="1.5"/><text x="972.5" y="176" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2933">Index: pgvector in PostgreSQL</text><text x="972.5" y="198" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#52606d">table rag_chunks, HNSW, cosine</text><text x="972.5" y="214" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#52606d">rebuilt by: python -m rag_lab.ingest</text><text x="972.5" y="230" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#52606d">config hash stored with the index</text><line x1="230" y1="193" x2="285" y2="193" stroke="#1f2933" stroke-width="1.5" marker-end="url(#ah)"/><line x1="485" y1="193" x2="540" y2="193" stroke="#1f2933" stroke-width="1.5" marker-end="url(#ah)"/><line x1="740" y1="193" x2="795" y2="193" stroke="
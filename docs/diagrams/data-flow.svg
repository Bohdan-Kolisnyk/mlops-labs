<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="830" viewBox="0 0 1760 830"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2933"/></marker></defs><rect width="1760" height="830" fill="#ffffff"/><text x="880" y="32" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#1f2933">Data flow on the seven layers of a production ML system</text><rect x="20" y="70" width="250" height="140" rx="8" fill="#f4f6f8" stroke="#52606d" stroke-width="1.5"/><text x="145.0" y="92" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2933">1 Data ingestion</text><text x="145.0" y="118" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1f2933">Airflow DAG ingest (monthly)</text><text x="145.0" y="136" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1f2933">posts archive + hourly bars</text><text x="145.0" y="154" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1f2933">to raw files in MinIO</text><rect x="300" y="95" width="150" height="90" rx="8" fill="#ffe3b0" stroke="#b36b00" stroke-width="2.5"/><text x="375.0" y="117" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2933">VERSION POINT</text><text x="375.0" y="143" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1f2933">DVC tag on raw data</text><text x="375.0" y="161" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1f2933">(remote: MinIO)</text><rect x="480" y="70" width="300" height="140" rx="8" fill="#f4f6f8" stroke="#52606d" stroke-width="1.5"/><text x="630.0" y="92" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2933">2 Preprocessing and transformation</text><text x="630.0" y="118" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1f2933">Airflow task preprocess</text><text x="630.0" y="136" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1f2933">window filter, drop empty and</text><text x="630.0" y="154" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1f2933">duplicate texts, align posts to</text><text x="630.0" y="172" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1f2933">bars, build labels</text><rect x="810" y="80" width="250" height="120" rx="8" fill="#ffe3b0" stroke="#b36b00" stroke-width="2.5"/><text x="935.0" y="102" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2933">QUALITY GATE</text><text x="935.0" y="128" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1f2933">schema, 7 bars per full day,</text><text x="935.0" y="146" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1f2933">timestamps, share of empty texts</text><text x="935.0" y="164" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1f2933">failed check stops the run</text><rect x="1090" y="60" width="640" height="170" rx="12" fill="#ffffff" stroke="#52606d" stroke-width="1.5"/><text x="1104" y="82" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#1f2933">3 Feature store (Feast)</text><rect x="1110" y="105" width="210" height="85" rx="8" fill="#f4f6f8" stroke="#52606d" stroke-width="1.5"/><text x="1215.0" y="127" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2933">Offline store</text><text x="1215.0" y="153" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1f2933">Parquet in MinIO</text><rect x="1480" y="105" width="230" height="85" rx="8" fill="#f4f6f8" stroke="#52606d" stroke-width="1.5"/><text x="1595.0" y="127" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2933">Online store</text><text x="1595.0" y="153" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1f2933">PostgreSQL</text><rect x="1335" y="100" width="130" height="95" rx="8" fill="#ffe3b0" stroke="#b36b00" stroke-width="2.5"/><text x="1400" y="130" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1f2933">training and</text><text x="1400" y="152" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1f2933">serving paths</text><text x="1400" y="174" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2933">DIVERGE HERE</text><path d="M 1320 148 L 1335 148" fill="none" stroke="#1f2933" stroke-width="1.8"/><path d="M 1465 148 L 1480 148" fill="none" stroke="#1f2933" stroke-width="1.8"/><path d="M 270 140 L 300 140" fill="none" stroke="#1f2933" stroke-width="1.8" marker-end="url(#ah)"/><path d="M 450 140 L 480 140" fill="none" stroke="#1f2933" stroke-width="1.8" marker-end="url(#ah)"/><path d="M 780 140 L 810 140" fill="none" stroke="#1f2933" stroke-width="1.8" marker-end="url(#ah)"/><path d="M 1060 140 L 1090 140" fill="none" stroke="#1f2933" stroke-width="1.8" marker-end="url(#ah)"/><rect x="20" y="340" width="380" height="140" rx="8" fill="#f4f6f8" stroke="#52606d" stroke-width="1.5"/><text x="210.0" y="362" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2933">4 Training pipeline</text><text x="210.0" y="388" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1f2933">Airflow task train</text><text x="210.0" y="406" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1f2933">baselines B0, B1, B2 + candidate,</text><text x="210.0" y="424" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1f2933">time split, runs logged in MLflow</text><rect x="550" y="340" width="560" height="140" rx="12" fill="#ffffff" stroke="#52606d" stroke-width="1.5"/><text x="564" y="362" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#1f2933">5 Model registry and deployment</text><rect x="565" y="385" width="200" height="75" rx="8" fill="#f4f6f8" stroke="#52606d" stroke-width="1.5"/><text x="665.0" y="407" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2933">MLflow Model Registry</text><text x="665.0" y="433" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1f2933">alias champion</text><rect x="895" y="385" width="200" height="75" rx="8" fill="#f4f6f8" stroke="#52606d" stroke-width="1.5"/><text x="995.0" y="407" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2933">Model service</text><text x="995.0" y="433" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1f2933">container on Minikube</text><path d="M 765 422 L 895 422" fill="none" stroke="#1f2933" stroke-width="1.8" marker-end="url(#ah)"/><text x="830" y="413" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2933" stroke="white" stroke-width="5" paint-order="stroke" stroke-linejoin="round">load by alias</text><rect x="1190" y="340" width="380" height="140" rx="8" fill="#f4f6f8" stroke="#52606d" stroke-width="1.5"/><text x="1380.0" y="362" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2933">6 Inference</text><text x="1380.0" y="388" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1f2933">real-time: POST /score, one post per request,</text><text x="1380.0" y="406" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1f2933">reads online store, price feed, recent posts</text><text x="1380.0" y="424" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1f2933">batch: not needed for serving,</text><text x="1380.0" y="442" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1f2933">offline evaluation only in the train task</text><rect x="1610" y="340" width="130" height="70" rx="8" fill="#f4f6f8" stroke="#52606d" stroke-width="1.5"/><text x="1675.0" y="362" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2933">Analyst</text><text x="1675.0" y="388" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1f2933">alert channel</text><rect x="1610" y="430" width="130" height="70" rx="8" fill="#f4f6f8" stroke="#52606d" stroke-width="1.5"/><text x="1675.0" y="452" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2933">Price feed</text><text x="1675.0" y="478" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1f2933">Yahoo Finance</text><rect x="550" y="600" width="480" height="130" rx="8" fill="#f4f6f8" stroke="#52606d" stroke-width="1.5"/><text x="790.0" y="622" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2933">7 Monitoring and retraining loop</text><text x="790.0" y="648" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1f2933">Evidently drift reports, Prometheus and Grafana</text><text x="790.0" y="666" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1f2933">rolling PR-AUC and alert rate</text><text x="790.0" y="684" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1f2933">label join 1 to 2 hours after the post</text><rect x="1190" y="620" width="280" height="85" rx="8" fill="#f4f6f8" stroke="#52606d" stroke-width="1.5"/><text x="1330.0" y="642" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2933">System owner</text><text x="1330.0" y="668" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1f2933">drift and performance alerts</text><text x="1330.0" y="686" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#1f2933">via the alert channel</text><path d="M 1215 190 L 1215 275 L 300 275 L 300 340" fill="none" stroke="#1f2933" stroke-width="1.8" marker-end="url(#ah)"/><text x="760" y="267" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2933" stroke="white" stroke-width="5" paint-order="stroke" stroke-linejoin="round">training path (offline store)</text><path d="M 1595 190 L 1595 275 L 1380 275 L 1380 340" fill="none" stroke="#1f2933" stroke-width="1.8" marker-end="url(#ah)"/><text x="1488" y="247" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2933" stroke="white" stroke-width="5" paint-order="stroke" stroke-linejoin="round">serving path</text><text x="1488" y="263" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2933" stroke="white" stroke-width="5" paint-order="stroke" stroke-linejoin="round">(online store)</text><path d="M 400 410 L 550 410" fill="none" stroke="#1f2933" stroke-width="1.8" marker-end="url(#ah)"/><text x="475" y="400" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2933" stroke="white" stroke-width="5" paint-order="stroke" stroke-linejoin="round">evaluate, register</text><path d="M 1110 422 L 1190 422" fill="none" stroke="#1f2933" stroke-width="1.8" marker-end="url(#ah)"/><text x="1150" y="412" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2933" stroke="white" stroke-width="5" paint-order="stroke" stroke-linejoin="round">serves</text><path d="M 1570 375 L 1610 375" fill="none" stroke="#1f2933" stroke-width="1.8" marker-end="url(#ah)"/><text x="1590" y="366" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2933" stroke="white" stroke-width="5" paint-order="stroke" stroke-linejoin="round">alert</text><path d="M 1610 465 L 1570 465" fill="none" stroke="#1f2933" stroke-width="1.8" marker-end="url(#ah)"/><text x="1590" y="456" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#1f2933" stroke="white" stroke-width="5" paint-order="stroke" stroke-linejoin="round">last bar</text><path d="M 1675 500 L 1675 765 L 790 765 L 790 730" fill="none" stroke="#1f2933" stroke-width="1.8" marker-end="url(#ah)"/><text x="1230" y="757" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2933" stroke="white" stroke-width="5" paint-order="stroke" stroke-linejoin="round">labels: hourly bars, 1 to 2 hours after the post</text><path d="M 1380 480 L 1380 560 L 790 560 L 790 600" fill="none" stroke="#1f2933" stroke-width="1.8" marker-end="url(#ah)"/><text x="1085" y="552" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2933" stroke="white" stroke-width="5" paint-order="stroke" stroke-linejoin="round">inputs, predictions</text><path d="M 1030 665 L 1190 665" fill="none" stroke="#1f2933" stroke-width="1.8" marker-end="url(#ah)"/><text x="1110" y="655" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2933" stroke="white" stroke-width="5" paint-order="stroke" stroke-linejoin="round">alert</text><path d="M 550 665 L 130 665 L 130 480" fill="none" stroke="#1f2933" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#ah)"/><text x="142" y="560" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#1f2933" stroke="white" stroke-width="5" paint-order="stroke" stroke-linejoin="round">trigger retraining</text><rect x="20" y="795" width="18" height="18" rx="8" fill="#ffe3b0" stroke="#b36b00" stroke-width="2"/><text x="46" y="809" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#1f2933">required marks: version point, quality gate, training/serving divergence</text><path d="M 640 804 L 700 804" fill="none" stroke="#1f2933" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#ah)"/><text x="710" y="809" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#1f2933">feedback loop (retraining trigger)</text></svg>
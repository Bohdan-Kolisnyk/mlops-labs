# Local Feast setup: parquet offline source, SQLite registry and online store.
# Everything it writes goes to data/ (git-ignored); the definitions are in definitions.py.
project: truth_social
provider: local
registry: data/registry.db
online_store:
  type: sqlite
  path: data/online.db
offline_store:
  type: file
entity_key_serialization_version: 3

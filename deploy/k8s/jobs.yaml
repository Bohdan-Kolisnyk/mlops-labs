# One-shot jobs of the bring-up. Both are idempotent (skip when the work is done), and
# deploy/up.py deletes finished ones before every apply because a Job's pod template is immutable.
apiVersion: batch/v1
kind: Job
metadata:
  name: model-bootstrap
  labels: {app: model-bootstrap}
spec:
  backoffLimit: 4
  template:
    metadata:
      labels: {app: model-bootstrap}
    spec:
      restartPolicy: Never
      containers:
        - name: bootstrap
          image: mlops-labs-ml:__TAG__
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "mlops_labs.serve.bootstrap", "--if-missing"]
          envFrom:
            - configMapRef: {name: app-config}
          env:
            - {name: IMAGE_TAG, value: "__TAG__"}
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: mlops-data}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: rag-ingest
  labels: {app: rag-ingest}
spec:
  backoffLimit: 4
  template:
    metadata:
      labels: {app: rag-ingest}
    spec:
      restartPolicy: Never
      containers:
        - name: ingest
          image: mlops-labs-llm:__TAG__
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "rag_lab.index_job"]
          env:
            - name: WAREHOUSE_URL
              valueFrom: {secretKeyRef: {name: app-secrets, key: WAREHOUSE_URL}}
          resources:
            requests: {cpu: 300m, memory: 768Mi}
            limits: {memory: 1536Mi}
          volumeMounts:
            - {name: config, mountPath: /app/rag/config.yaml, subPath: config.yaml}
            - {name: prompts, mountPath: /app/rag/prompts}
      volumes:
        - name: config
          configMap: {name: rag-config}
        - name: prompts
          configMap: {name: rag-prompts}

[project]
name = "rag-lab"
version = "0.1.0"
description = "Lab 3: LLM baseline and retrieval (own environment: sentence-transformers and the LLM client stay out of the Lab 2 lockfile)"
requires-python = ">=3.12"
dependencies = [
    "sentence-transformers>=3.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "anthropic>=0.40",
    "mlflow-skinny==3.16.1",
    "pyyaml",
    "numpy",
    "pandas",
    "pyarrow",
    "scikit-learn",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag_lab"]

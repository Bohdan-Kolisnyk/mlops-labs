# The single configuration of Lab 3. Ingestion, retrieval, the LLM calls and every evaluation
# run read this file; nothing below is repeated in code. Paths are relative to rag/.
corpus:
  path: data/corpus.parquet        # written by scripts/export_rag_corpus.py
  min_chars: 40                    # shorter posts carry no content to retrieve
chunking:
  size_words: 120
  overlap_words: 20
embedding:
  model: sentence-transformers/all-MiniLM-L6-v2
  dim: 384
retrieval:
  top_k: 10                         # serving value; the sweep below varies it
  sweep_top_k: [1, 3, 5, 10]
index:
  table: rag_chunks
llm:
  provider: anthropic
  model: claude-haiku-5-5          # server address / model name live here, never in code
  max_tokens: 400
  price_per_mtok_in: 0.10          # USD per million tokens, prompts under 100K tokens
  price_per_mtok_out: 0.50         # check the provider's price page before quoting these
  concurrency: 6
prompts:
  zero_shot: prompts/zero_shot_label.md
  rag_answer: prompts/rag_answer.md
  judge: prompts/judge.md
  gen_question: prompts/gen_question.md
eval:
  set_path: eval/eval_set.jsonl    # committed: the evaluation set is part of the repository
  candidates: 120                  # posts sampled; about 40% survive the no-quote filter, 30 are required
  seed: 7
baseline:
  test_path: data/test_posts.parquet
  sample_size: 150
  seed: 7
mlflow:
  tracking_uri_default: http://localhost:5000
  rag_experiment: truth-social-llm-rag
  lab2_experiment: truth-social-abnormal-moves
